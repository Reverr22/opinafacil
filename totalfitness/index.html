<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Déjanos tu opinión</title>

  <style>
    :root {
      --color: #6F7D3C;
      --color-dark: #4E5A28;
      --color-light: #F2F5E9;
      --text: #171717;
      --muted: #707070;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;

      background:
        radial-gradient(circle at top left, var(--color-light), transparent 45%),
        linear-gradient(135deg, #ffffff 0%, #f6f6f6 100%);

      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(255,255,255,0.94);
      border-radius: 32px;
      padding: 38px 30px 30px;
      text-align: center;

      box-shadow:
        0 25px 70px rgba(0,0,0,0.12);

      border: 1px solid rgba(0,0,0,0.05);

      animation: aparecer .6s ease;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 18px;

      border-radius: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--color-light);
      color: var(--color);

      font-size: 27px;
      font-weight: 800;

      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .business-name {
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .stars {
      color: var(--color);
      font-size: 30px;
      letter-spacing: 4px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 30px;
      line-height: 1.15;
      margin-bottom: 15px;
    }

    .description {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
      margin-bottom: 28px;
    }

    .review-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      width: 100%;
      padding: 18px 20px;

      border-radius: 17px;

      background: var(--color);
      color: white;

      text-decoration: none;
      font-size: 17px;
      font-weight: 800;

      box-shadow: 0 12px 25px rgba(0,0,0,0.14);

      transition: transform .2s ease, background .2s ease;
    }

    .review-button:hover {
      background: var(--color-dark);
      transform: translateY(-2px);
    }

    .google-icon {
      font-size: 22px;
    }

    .thanks {
      margin-top: 24px;
      color: var(--muted);
      font-size: 15px;
    }

    .brand {
      margin-top: 25px;
      padding-top: 18px;

      border-top: 1px solid #eeeeee;

      color: #999;
      font-size: 13px;
    }

    .brand strong {
      color: var(--color);
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 32px 22px 25px;
        border-radius: 27px;
      }

      h1 {
        font-size: 27px;
      }

      .business-name {
        font-size: 24px;
      }
    }
    body {
  background:
    radial-gradient(circle at top left, #333333 0%, transparent 38%),
    linear-gradient(135deg, #080808 0%, #1a1a1a 100%);
  color: #ffffff;
}

.card {
  background: rgba(20,20,20,0.96);
  border: 1px solid #333333;
}

.description,
.thanks {
  color: #b5b5b5;
}

.brand {
  border-top-color: #333333;
  color: #777777;
}

.business-name {
  color: #ffffff;
}

.logo {
  background: #ffffff;
  color: #111111;
}
  </style>
</head>

<body>

  <div class="card">

    <div class="logo" id="logo"></div>

    <div class="business-name" id="businessName"></div>

    <div class="stars">
      ★★★★★
    </div>

    <h1 id="message"></h1>

    <p class="description">
      Tu opinión nos ayuda muchísimo a seguir creciendo.
      Si has disfrutado de tu experiencia, nos encantaría conocer tu opinión.
    </p>

    <a
      id="reviewButton"
      class="review-button"
      href="#"
      target="_blank"
      rel="noopener"
    >
      <span class="google-icon">⭐</span>
      Dejar una reseña en Google
    </a>

    <div class="thanks">
      Gracias por confiar en <strong id="thanksName"></strong> ❤️
    </div>

    <div class="brand">
      Powered by <strong>Opina Fácil</strong>
    </div>

  </div>

  <script>

    /*
      =====================================
      CONFIGURACIÓN DEL NEGOCIO
      =====================================
    */

    const negocio = {

      nombre: "Total Fitness",

      color: "#E5E5E5",

      google:
        "https://search.google.com/local/writereview?placeid=ChIJH72srfEBYA0ROQO1rNnHsdM",

      mensaje:
        "¿Te ha gustado tu experiencia?",

      logo: ""

    };


    /*
      =====================================
      NO TOCAR DESDE AQUÍ
      =====================================
    */

    document.documentElement.style.setProperty(
      "--color",
      negocio.color
    );

    document.documentElement.style.setProperty(
      "--color-dark",
      oscurecer(negocio.color)
    );

    document.documentElement.style.setProperty(
      "--color-light",
      aclarar(negocio.color)
    );

    document.title =
      negocio.nombre + " | Déjanos tu opinión";

    document.getElementById("businessName").textContent =
      negocio.nombre;

    document.getElementById("thanksName").textContent =
      negocio.nombre;

    document.getElementById("message").textContent =
      negocio.mensaje;

    document.getElementById("reviewButton").href =
      negocio.google;


    const logo = document.getElementById("logo");

    if (negocio.logo) {

      logo.innerHTML =
        `<img src="${negocio.logo}" alt="${negocio.nombre}">`;

    } else {

      const iniciales = negocio.nombre
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map(palabra => palabra[0])
        .join("")
        .toUpperCase();

      logo.textContent = iniciales;
    }


    function aclarar(hex) {

      let r = parseInt(hex.substring(1,3),16);
      let g = parseInt(hex.substring(3,5),16);
      let b = parseInt(hex.substring(5,7),16);

      r = Math.round(r + (255-r)*0.88);
      g = Math.round(g + (255-g)*0.88);
      b = Math.round(b + (255-b)*0.88);

      return `rgb(${r}, ${g}, ${b})`;
    }


    function oscurecer(hex) {

      let r = parseInt(hex.substring(1,3),16);
      let g = parseInt(hex.substring(3,5),16);
      let b = parseInt(hex.substring(5,7),16);

      r = Math.round(r * 0.72);
      g = Math.round(g * 0.72);
      b = Math.round(b * 0.72);

      return `rgb(${r}, ${g}, ${b})`;
    }

  </script>

</body>
</html>
