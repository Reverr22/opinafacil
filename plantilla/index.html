<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Feel Good | Tu opinión importa</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#171717;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px
}

.card{
  background:white;
  width:100%;
  max-width:430px;
  border-radius:24px;
  padding:42px 28px;
  text-align:center;
  box-shadow:0 15px 50px rgba(0,0,0,.08)
}

.logo{
  font-size:30px;
  font-weight:800;
  margin-bottom:24px
}

.stars{
  font-size:30px;
  letter-spacing:4px;
  margin-bottom:20px
}

h1{
  font-size:28px;
  margin-bottom:14px
}

.subtitle{
  color:#666;
  font-size:17px;
  line-height:1.55;
  margin-bottom:28px
}

.review-button{
  display:block;
  width:100%;
  padding:17px;
  background:#111;
  color:white;
  text-decoration:none;
  border-radius:13px;
  font-size:17px;
  font-weight:700
}

.review-button:hover{
  opacity:.9
}

.thanks{
  margin-top:25px;
  color:#777;
  font-size:14px
}

.brand{
  margin-top:30px;
  font-size:13px;
  color:#aaa
}

.brand strong{
  color:#777
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">I Feel Good</div>

  <div class="stars">★★★★★</div>

  <h1>¿Cómo ha sido tu experiencia?</h1>

  <p class="subtitle">
    Tu opinión nos ayuda muchísimo a seguir mejorando.
    Si has disfrutado de tu experiencia con nosotros,
    nos encantaría conocer tu opinión.
  </p>

  <a
    class="review-button"
    href="https://search.google.com/local/writereview?placeid=ChIJR4JY6bgHYA0RwmP8M18AdeQ"
    target="_blank"
    rel="noopener"
  >
    ⭐ Dejar una reseña en Google
  </a>

  <p class="thanks">
    Gracias por confiar en I Feel Good ❤️
  </p>

  <div class="brand">
    Powered by <strong>Opina Fácil</strong>
  </div>

</div>

</body>
</html>
